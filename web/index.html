<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="theme-color" content="#121212">
<meta name="color-scheme" content="dark">
<title>Meowmew</title>
<style>
  :root { --line: #e8e8e8; --bg: #121212; --text: #eee; --panel: #1e1e1e; --muted: #aaa; }
  * { box-sizing: border-box; }
  body { margin: 0; padding: 16px; font-family: system-ui, sans-serif; background: var(--bg); color: var(--text);
         display: flex; flex-direction: column; align-items: center; gap: 12px; }
  h1 { margin: 0; font-size: 22px; }
  .bar { display: flex; flex-wrap: wrap; gap: 8px; align-items: center; justify-content: center; }
  button, select { font: inherit; padding: 8px 14px; border: 1px solid #444; border-radius: 8px; background: var(--panel); color: var(--text); cursor: pointer; }
  button:active { background: #333; }
  input[type=checkbox] { accent-color: #8ab4f8; }
  html { -webkit-tap-highlight-color: transparent; }
  .status { display: flex; gap: 16px; font-size: 18px; }
  #board { display: grid; border: 3px solid var(--line); touch-action: none; user-select: none;
           width: min(92vw, 520px); aspect-ratio: 1; }
  .cell { position: relative; display: flex; align-items: center; justify-content: center;
          font-size: clamp(14px, 5vw, 30px); cursor: pointer; border: 1px solid rgba(0,0,0,.35); }
  .cell.bt { border-top: 3px solid var(--line); }
  .cell.bl { border-left: 3px solid var(--line); }
  .cell.wrong { animation: flash .5s; }
  @keyframes flash { 0%,100% { background-image: none; } 50% { background-image: linear-gradient(#f005,#f005); } }
  .x { color: rgba(255,255,255,.75); font-size: .7em; }
  .msg { min-height: 1.4em; font-weight: 600; }
  .rules { max-width: 520px; font-size: 14px; color: var(--muted); line-height: 1.4; }
  label { font-size: 14px; }
</style>
</head>
<body>
<h1>Meowmew</h1>

<div class="bar">
  <label>Size
    <select id="size">
      <option>5</option><option>6</option><option>7</option><option selected>8</option><option>9</option><option>10</option>
    </select>
  </label>
  <button id="new">New puzzle</button>
  <button id="daily">Daily puzzle</button>
  <button id="restart">Restart</button>
</div>
<div class="bar">
  <label><input type="checkbox" id="hearts" checked> Hearts (3 mistakes)</label>
  <label><input type="checkbox" id="autox"> Auto-X around cats</label>
</div>

<div class="status">
  <span id="lives"></span>
  <span id="cats"></span>
  <span id="time">0:00</span>
</div>

<div id="board"></div>
<div class="msg" id="msg"></div>
<div class="bar">
  <button id="hint">Hint</button>
  <button id="reveal">Show solution</button>
</div>

<div class="rules">
  <b>Rules:</b> Place one 🐱 in every row, every column and every coloured region.
  Cats can't touch each other, not even diagonally.<br>
  <b>Controls:</b> Tap a cell to cycle empty → ✕ → 🐱. Drag across cells to mark ✕ quickly.
  On a computer, right-click places a cat directly.
</div>

<script src="puzzle.js"></script>
<script>
const COLORS = ["#7a2e2e","#2e4f7a","#36662b","#7a6420","#5b3480","#21686a","#8a4a24","#4a4a4a","#5c6b1c","#7a2b5c"];
const EMPTY = 0, MARK = 1, CAT = 2;
const $ = id => document.getElementById(id);

let puzzle, state, lives, over, startTime, timerId, dragging = null, dragMoved = false;

function newGame(seed, n) {
  puzzle = Puzzle.generate(n, seed);
  restart();
}

function restart() {
  const n = puzzle.n;
  state = Array.from({ length: n }, () => new Array(n).fill(EMPTY));
  lives = 3; over = false;
  $("msg").textContent = "";
  startTime = Date.now();
  clearInterval(timerId);
  timerId = setInterval(tick, 500);
  tick();
  render();
}

function tick() {
  const s = Math.floor((Date.now() - startTime) / 1000);
  $("time").textContent = `⏱ ${Math.floor(s / 60)}:${String(s % 60).padStart(2, "0")}`;
}

function render() {
  const n = puzzle.n, R = puzzle.regions, board = $("board");
  board.style.gridTemplateColumns = `repeat(${n}, 1fr)`;
  board.innerHTML = "";
  for (let r = 0; r < n; r++) for (let c = 0; c < n; c++) {
    const d = document.createElement("div");
    d.className = "cell";
    if (r > 0 && R[r - 1][c] !== R[r][c]) d.classList.add("bt");
    if (c > 0 && R[r][c - 1] !== R[r][c]) d.classList.add("bl");
    d.style.background = COLORS[R[r][c] % COLORS.length];
    d.dataset.r = r; d.dataset.c = c;
    d.innerHTML = state[r][c] === CAT ? "🐱" : state[r][c] === MARK ? '<span class="x">✕</span>' : "";
    board.appendChild(d);
  }
  const placed = state.flat().filter(v => v === CAT).length;
  $("cats").textContent = `🐱 ${placed}/${n}`;
  $("lives").textContent = $("hearts").checked ? "❤️".repeat(lives) + "🖤".repeat(3 - lives) : "";
}

// Check a full board against the rules (used when hearts are off).
function solvedByRules() {
  const n = puzzle.n, cats = [];
  for (let r = 0; r < n; r++) for (let c = 0; c < n; c++) if (state[r][c] === CAT) cats.push([r, c]);
  if (cats.length !== n) return false;
  const rows = new Set(), cols = new Set(), regs = new Set();
  for (const [r, c] of cats) { rows.add(r); cols.add(c); regs.add(puzzle.regions[r][c]); }
  if (rows.size !== n || cols.size !== n || regs.size !== n) return false;
  for (const [a, b] of cats) for (const [y, x] of cats)
    if ((a !== y || b !== x) && Math.abs(a - y) <= 1 && Math.abs(b - x) <= 1) return false;
  return true;
}

function autoX(r, c) {
  const n = puzzle.n, g = puzzle.regions[r][c];
  for (let y = 0; y < n; y++) for (let x = 0; x < n; x++) {
    if (state[y][x] !== EMPTY) continue;
    if (y === r || x === c || puzzle.regions[y][x] === g || (Math.abs(y - r) <= 1 && Math.abs(x - c) <= 1))
      state[y][x] = MARK;
  }
}

function placeCat(r, c) {
  if ($("hearts").checked && puzzle.solution[r] !== c) {
    lives--;
    state[r][c] = MARK;
    render();
    const el = $("board").children[r * puzzle.n + c];
    el.classList.add("wrong");
    if (lives <= 0) {
      over = true; clearInterval(timerId);
      $("msg").textContent = "Out of hearts! Press Restart to try again.";
    }
    return;
  }
  state[r][c] = CAT;
  if ($("autox").checked) autoX(r, c);
  checkWin();
}

function checkWin() {
  render();
  if (solvedByRules()) {
    over = true; clearInterval(timerId);
    $("msg").textContent = `Solved in ${$("time").textContent.replace("⏱ ", "")}! 🎉`;
  }
}

function cellFrom(e) {
  const el = document.elementFromPoint(e.clientX, e.clientY);
  return el && el.closest(".cell");
}

$("board").addEventListener("contextmenu", e => e.preventDefault());
$("board").addEventListener("pointerdown", e => {
  if (over) return;
  const el = cellFrom(e); if (!el) return;
  const r = +el.dataset.r, c = +el.dataset.c;
  if (e.button === 2) { if (state[r][c] !== CAT) placeCat(r, c); return; }
  dragging = { r, c, value: state[r][c] === EMPTY ? MARK : null };
  dragMoved = false;
});
$("board").addEventListener("pointermove", e => {
  if (!dragging || over || dragging.value === null) return;
  const el = cellFrom(e); if (!el) return;
  const r = +el.dataset.r, c = +el.dataset.c;
  if (r === dragging.r && c === dragging.c && !dragMoved) return;
  if (!dragMoved) { dragMoved = true; state[dragging.r][dragging.c] = MARK; }
  if (state[r][c] === EMPTY) { state[r][c] = MARK; render(); }
});
window.addEventListener("pointerup", () => {
  if (!dragging) return;
  const { r, c } = dragging;
  dragging = null;
  if (over) return;
  if (dragMoved) { render(); return; }
  // Simple tap: cycle empty -> X -> cat -> empty
  if (state[r][c] === EMPTY) { state[r][c] = MARK; render(); }
  else if (state[r][c] === MARK) placeCat(r, c);
  else { state[r][c] = EMPTY; render(); }
});

$("new").onclick = () => newGame(Math.floor(Math.random() * 2 ** 31), +$("size").value);
$("daily").onclick = () => {
  const d = new Date();
  const seed = d.getFullYear() * 10000 + (d.getMonth() + 1) * 100 + d.getDate();
  newGame(seed * 31 + +$("size").value, +$("size").value);
  $("msg").textContent = `Daily puzzle for ${d.toDateString()}`;
};
$("restart").onclick = restart;
$("size").onchange = $("new").onclick;
$("hearts").onchange = render;
$("hint").onclick = () => {
  if (over) return;
  // Reveal one correct cat that isn't placed yet.
  const rows = [...Array(puzzle.n).keys()].filter(r => state[r][puzzle.solution[r]] !== CAT);
  if (!rows.length) return;
  const r = rows[Math.floor(Math.random() * rows.length)];
  // Remove any wrong cat in that row first.
  for (let c = 0; c < puzzle.n; c++) if (state[r][c] === CAT) state[r][c] = EMPTY;
  placeCat(r, puzzle.solution[r]);
};
$("reveal").onclick = () => {
  const n = puzzle.n;
  state = Array.from({ length: n }, (_, r) => Array.from({ length: n }, (_, c) => puzzle.solution[r] === c ? CAT : EMPTY));
  over = true; clearInterval(timerId);
  render();
  $("msg").textContent = "Solution shown.";
};

$("new").onclick();
</script>
</body>
</html>
